openapi: 3.0.3
info:
  title: Acme Admin Portal API
  version: 0.1.0
paths:
  /orders:
    get:
      summary: List all orders
      responses:
        '200':
          description: All orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
  /orders/{id}:
    get:
      summary: Get one order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: No order has this id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /refunds:
    post:
      summary: Refund up to 50 orders in one request
      description: >
        All-or-nothing. Retrying with the same idempotencyKey and the same orders
        returns the original response (header Idempotent-Replay true) and refunds nothing again.
        Writes one audit event per refunded order.
      parameters:
        - name: X-Agent-Id
          in: header
          required: true
          description: Support agent recorded in the audit event. Placeholder until real authentication exists.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderIds, idempotencyKey]
              properties:
                orderIds:
                  type: array
                  minItems: 1
                  maxItems: 50
                  uniqueItems: true
                  items: { type: integer }
                idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Orders refunded (or the stored response of an earlier identical request).
          content:
            application/json:
              schema:
                type: object
                properties:
                  refunds:
                    type: array
                    items:
                      type: object
                      properties:
                        orderId: { type: integer }
                        amount: { type: number }
                  total: { type: number }
                  refundedAt: { type: string, format: date-time }
        '400':
          description: Invalid body, more than 50 orders, or missing X-Agent-Id.
        '409':
          description: The idempotencyKey was already used with different orders.
        '422':
          description: Unknown, non-refundable or already refunded orders. The orderIds field lists them. Nothing is refunded.
components:
  schemas:
    Order:
      type: object
      required: [id, customer, email, total, status, createdAt]
      properties:
        id: { type: integer }
        customer: { type: string }
        email: { type: string, format: email }
        total: { type: number }
        status: { type: string, enum: [pending, paid, shipped, cancelled] }
        createdAt: { type: string, format: date-time }
