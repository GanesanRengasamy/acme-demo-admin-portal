openapi: 3.0.3
info:
  title: Acme Admin Portal API
  version: 0.1.0
paths:
  /orders:
    get:
      summary: List all orders
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of orders to return (1-200, default 50).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of orders to skip (>= 0, default 0).
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '400':
          description: Invalid limit or offset parameter.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /orders/{id}:
    get:
      summary: Get one order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: No order has this id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
components:
  schemas:
    Order:
      type: object
      required: [id, customer, email, total, status, createdAt]
      properties:
        id: { type: integer }
        customer: { type: string }
        email: { type: string, format: email }
        total: { type: number }
        status: { type: string, enum: [pending, paid, shipped, cancelled] }
        createdAt: { type: string, format: date-time }
